name: Publish Documentation

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  documentation:
    name: Build & Check Doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Before the image build, so a missing secret fails in seconds.
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure (docs only)
        uses: ./.github/actions/dev
        with:
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          run: cmake -S . -B build -DQRMCI_BUILD_UNIT_TESTS=OFF -DQRMCI_BUILD_INTEGRATION_TESTS=OFF -DQRMCI_BUILD_APPS=OFF -DBUILD_QRMCI_DOCS=ON
      - name: Build documentation
        uses: ./.github/actions/dev
        with:
          run: cmake --build build --target docs --parallel
      - name: Check for Doxygen errors
        run: |
          if [ -f build/docs/doxygen_warnings.txt ]; then
            if [ -s build/docs/doxygen_warnings.txt ]; then
              echo "Doxygen warnings found:"
              cat build/docs/doxygen_warnings.txt
              exit 1
            fi
          fi
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/html
          force_orphan: true
