name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (Formatting & Linting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Pre-commit Hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  static-analysis:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: pre-commit
    steps:
      # Before the image build, so a missing secret fails in seconds.
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure with compile commands
        uses: ./.github/actions/dev
        with:
          extra-packages: clang-tidy
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Generate the protocol headers clang-tidy needs to parse sources
        uses: ./.github/actions/dev
        with:
          run: cmake --build build --target mqss_protocol --parallel
      - name: Run clang-tidy on all sources
        uses: ./.github/actions/dev
        with:
          run: run-clang-tidy -p build "^/workspace/(include|src|apps|tests)/.*"

  build:
    name: Build & Test (${{ matrix.compiler }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: pre-commit
    strategy:
      fail-fast: false
      # Clang is not currently supported: `clang++-17 -std=c++23` fails to compile `#include <expected>`.
      matrix:
        include:
          - compiler: gcc
            version: "14"
            cc: gcc-14
            cxx: g++-14
          - compiler: gcc
            version: "15"
            cc: gcc-15
            cxx: g++-15
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # The tests run in a container on the runner's network namespace, so
      # they reach the broker through its published port, not by alias.
      QRMCI_AMQP_HOST: localhost
    steps:
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure
        uses: ./.github/actions/dev
        with:
          extra-packages: ${{ matrix.cc }} ${{ matrix.cxx }}
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQRMCI_WARNINGS_AS_ERRORS=ON -DQRMCI_RUN_INTEGRATION_TESTS=ON
      - name: Build
        uses: ./.github/actions/dev
        with:
          run: cmake --build build --parallel
      - name: Run unit tests
        uses: ./.github/actions/dev
        with:
          run: ctest --test-dir build/tests -LE integration --output-on-failure
      - name: Run integration tests
        uses: ./.github/actions/dev
        with:
          run: ctest --test-dir build/tests -L integration --output-on-failure
      - name: Upload daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-logs-${{ matrix.compiler }}-${{ matrix.version }}
          path: build/tests/integration/daemon-logs/
          if-no-files-found: ignore
