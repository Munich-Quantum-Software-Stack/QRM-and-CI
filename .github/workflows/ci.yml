name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  pre-commit:
    name: Pre-commit (Formatting & Linting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Cache Pre-commit Hooks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  static-analysis:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: pre-commit
    steps:
      # Before the image build, so a missing secret fails in seconds.
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure with compile commands
        uses: ./.github/actions/dev
        with:
          extra-packages: clang-tidy
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Generate the protocol headers clang-tidy needs to parse sources
        uses: ./.github/actions/dev
        with:
          run: cmake --build build --target mqss_protocol --parallel
      - name: Run clang-tidy on all sources
        uses: ./.github/actions/dev
        with:
          run: run-clang-tidy -p build "^/workspace/(include|src|apps|tests)/.*"

  build:
    name: Build & Test (${{ matrix.compiler }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: pre-commit
    strategy:
      fail-fast: false
      # Clang is not currently supported: `clang++-17 -std=c++23` fails to compile `#include <expected>`.
      matrix:
        include:
          - compiler: gcc
            version: "14"
            cc: gcc-14
            cxx: g++-14
          - compiler: gcc
            version: "15"
            cc: gcc-15
            cxx: g++-15
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # The tests run in a container on the runner's network namespace, so
      # they reach the broker through its published port, not by alias.
      QRMCI_AMQP_HOST: localhost
    steps:
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure
        uses: ./.github/actions/dev
        with:
          extra-packages: ${{ matrix.cc }} ${{ matrix.cxx }}
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQRMCI_WARNINGS_AS_ERRORS=ON -DQRMCI_RUN_INTEGRATION_TESTS=ON
      - name: Build
        uses: ./.github/actions/dev
        with:
          # Unbounded --parallel OOM-kills on ubuntu-latest (16GB/4 cores):
          # mqt-core/mqt-qmap's heavy template TUs can exceed 4GB each at
          # -O2, and four compiling at once exceeds the runner's memory.
          run: cmake --build build --parallel 2
      - name: Run unit tests
        uses: ./.github/actions/dev
        with:
          run: ctest --test-dir build/tests -LE integration --output-on-failure
      - name: Run integration tests
        uses: ./.github/actions/dev
        with:
          run: ctest --test-dir build/tests -L integration --output-on-failure
      - name: Upload daemon logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daemon-logs-${{ matrix.compiler }}-${{ matrix.version }}
          path: build/tests/integration/daemon-logs/
          if-no-files-found: ignore

  coverage:
    name: Coverage (gcc 14, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: pre-commit
    permissions:
      contents: read
      packages: read
      id-token: write # Codecov upload via OIDC
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check for the MQSS read token
        env:
          MQSS_READ_TOKEN: ${{ secrets.MQSS_READ_TOKEN }}
        run: |
          if [ -z "$MQSS_READ_TOKEN" ]; then
            echo "::error::secrets.MQSS_READ_TOKEN is empty. Configure clones the private MQSS-Submitter repository; see docs/development-guide.md."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure with coverage instrumentation
        uses: ./.github/actions/dev
        with:
          extra-packages: gcc-14 g++-14 gcovr
          github-token: ${{ secrets.MQSS_READ_TOKEN }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_EXE_LINKER_FLAGS=--coverage -DCMAKE_SHARED_LINKER_FLAGS=--coverage
      - name: Build
        uses: ./.github/actions/dev
        with:
          run: cmake --build build --parallel 2
      - name: Run unit tests
        uses: ./.github/actions/dev
        with:
          run: ctest --test-dir build/tests -LE integration --output-on-failure
      - name: Collect coverage
        uses: ./.github/actions/dev
        with:
          run: gcovr --root /workspace --filter /workspace/src/ --filter /workspace/include/ --xml coverage.xml --print-summary build
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Switch to true (as in QDMI) once the repository is registered with Codecov.
          fail_ci_if_error: false
          files: coverage.xml
          flags: cpp

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - pre-commit
      - static-analysis
      - build
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
