name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (Formatting & Linting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Pre-commit Hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  static-analysis:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: "ghcr.io/akshay9594/mqss-passes-suite/mqssci-deps:llvm22.1.0-cudaq0.15.0-catalyst0.15.0-amd64"
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: |
          apt-get update && apt-get install -y clang-tidy && rm -rf /var/lib/apt/lists/*
      - name: Configure with compile commands
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on all sources
        run: |
          run-clang-tidy -p build "^$(pwd)/(include|src|apps|tests)/.*"

  build:
    name: Build & Test (${{ matrix.compiler }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: pre-commit
    strategy:
      fail-fast: false
      # Clang is not currently supported: `clang++-17 -std=c++23` fails to compile `#include <expected>`.
      matrix:
        include:
          - compiler: gcc
            version: "13"
            cc: gcc-13
            cxx: g++-13
          - compiler: gcc
            version: "15"
            cc: gcc-15
            cxx: g++-15
    container:
      image: "ghcr.io/akshay9594/mqss-passes-suite/mqssci-deps:llvm22.1.0-cudaq0.15.0-catalyst0.15.0-amd64"
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      QRMCI_AMQP_HOST: rabbitmq
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler (${{ matrix.compiler }} ${{ matrix.version }})
        run: |
          apt-get update
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            apt-get install -y gcc-${{ matrix.version }} g++-${{ matrix.version }}
          else
            apt-get install -y clang-${{ matrix.version }}
          fi
          rm -rf /var/lib/apt/lists/*
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQRMCI_WARNINGS_AS_ERRORS=ON \
            -DQRMCI_RUN_INTEGRATION_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests
        run: ctest --test-dir build/tests -LE integration --output-on-failure
      - name: Run integration tests
        run: ctest --test-dir build/tests -L integration --output-on-failure
